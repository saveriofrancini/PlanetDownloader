name: Offline validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install binary dependencies
        run: python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Verify Windows dependencies
        if: runner.os == 'Windows'
        run: python verifica_installazione.py
      - name: Test synthetic API and raster workflows
        run: python -m pytest -q
